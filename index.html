<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Ganti Baju</title>
    <style>
        * {font-family:Arial,sans-serif; margin:0; padding:0; box-sizing:border-box;}
        body {background:#f5f5f5; padding:20px;}
        .wrap {max-width:600px; margin:0 auto; background:white; padding:25px; border-radius:12px;}
        h1 {text-align:center; margin-bottom:20px; color:#222;}
        .box {border:2px dashed #ccc; padding:30px; text-align:center; border-radius:10px; margin-bottom:20px; cursor:pointer;}
        .box:hover {border-color:#d32f2f; background:#fff5f5;}
        .box img {width:150px; height:150px; border-radius:8px; margin:10px 0; display:none; object-fit:cover;}
        .btn {width:100%; padding:15px; background:#d32f2f; color:white; border:none; border-radius:10px; font-size:18px; font-weight:bold; cursor:pointer; margin-top:10px;}
        .btn:disabled {opacity:0.5;}
        .hasil {margin-top:20px; display:none;}
        .hasil img {width:100%; border-radius:10px;}
        .pilih {display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:20px 0;}
        .item {border:2px solid #eee; padding:12px; text-align:center; border-radius:8px; cursor:pointer;}
        .item.aktif {border-color:#d32f2f; background:#fff5f5;}
        .loading {text-align:center; display:none; padding:20px;}
        .spin {width:35px; height:35px; border:4px solid #ddd; border-top-color:#d32f2f; border-radius:50%; animation:putar 1s linear infinite; margin:0 auto 10px;}
        @keyframes putar {to{transform:rotate(360deg);}}
    </style>
</head>
<body>
<div class="wrap">
    <h1>✨ AI Ganti Baju</h1>

    <label class="box">
        <input type="file" id="f" accept="image/*" style="display:none">
        <img id="p" alt="Foto">
        <p id="t">Klik di sini pilih foto</p>
    </label>

    <div class="pilih">
        <div class="item" data-q="anak laki-laki pakai jas hitam kemeja putih dasi, foto realistis">Jas Formal</div>
        <div class="item" data-q="anak laki-laki pakai mantel cokelat baju putih, foto realistis">Mantel Cokelat</div>
        <div class="item" data-q="anak laki-laki pakai kemeja putih rapi bersih, foto realistis">Kemeja Putih</div>
        <div class="item" data-q="anak laki-laki pakai jas abu-abu baju hitam, foto realistis">Jas Modern</div>
    </div>

    <button class="btn" id="b">Buat Gambar</button>

    <div class="loading" id="l"><div class="spin"></div><p>Tunggu sebentar...</p></div>
    <div class="hasil" id="h"><h3>Hasil:</h3><img id="i" alt="Hasil"></div>
</div>

<script>
const f = document.getElementById('f');
const p = document.getElementById('p');
const t = document.getElementById('t');
const b = document.getElementById('b');
const l = document.getElementById('l');
const h = document.getElementById('h');
const i = document.getElementById('i');
const items = document.querySelectorAll('.item');

let adaFoto = false;
let pilihTeks = '';

f.addEventListener('change', e => {
    if (!e.target.files[0]) return;
    const r = new FileReader();
    r.onload = x => { p.src = x.target.result; p.style.display = 'block'; t.innerText = '✅ Foto siap'; adaFoto = true; };
    r.readAsDataURL(e.target.files[0]);
});

items.forEach(x => {
    x.addEventListener('click', () => {
        items.forEach(y => y.classList.remove('aktif'));
        x.classList.add('aktif');
        pilihTeks = x.dataset.q;
    });
});

b.addEventListener('click', async () => {
    if (!adaFoto) { alert('Pilih foto dulu!'); return; }
    if (!pilihTeks) { alert('Pilih gaya dulu!'); return; }

    b.disabled = true;
    l.style.display = 'block';
    h.style.display = 'none';

    const url = 'https://image.pollinations.ai/prompt/' + encodeURIComponent(pilihTeks) + '?width=768&height=768&nologo=true';
    i.src = url;
    i.onload = () => { h.style.display = 'block'; };
    i.onerror = () => { alert('Gagal memuat, coba lagi'); };

    l.style.display = 'none';
    b.disabled = false;
});
</script>
</body>
</html>
